# Cada push a main y cada PR: comprobaciones rápidas. Las E2E y los instaladores van en release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fidelity_report:
        description: Generar el informe de fidelidad frente a Word
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, unitarias, corpus y licencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:deps
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Corpus de fidelidad (lectura y escritura sin pérdidas, sin DOM)
        run: pnpm run fidelity

  fidelity-report:
    name: Informe de fidelidad frente a Word
    if: github.event_name == 'workflow_dispatch' && inputs.fidelity_report
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: xvfb-run --auto-servernum pnpm run fidelity:report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: informe-fidelidad
          path: tests/fidelity/report/
          retention-days: 30
